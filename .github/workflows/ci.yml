name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, macos-13]   # Apple Silicon (arm64) + Intel (x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
